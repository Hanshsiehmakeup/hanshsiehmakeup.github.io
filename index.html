<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HANS HSIEH — Makeup & Hair Artist</title>
<meta name="description" content="Hans Hsieh 謝 — 台北彩妝髮型師。Makeup & Hair Artist based in Taipei. Editorial, celebrity, campaign.">
<meta property="og:title" content="HANS HSIEH — Makeup & Hair Artist">
<meta property="og:description" content="Makeup & Hair Artist based in Taipei.">
<meta property="og:image" content="ig/i002_01.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--paper:#fff;--mute:#8a8a8a;--line:#e6e6e6}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:400 15px/1.7 Inter,"Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid var(--line)}
.logo{white-space:nowrap;font-family:"Archivo Black",sans-serif;font-size:20px;letter-spacing:.02em}
nav a{margin-left:22px;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
nav a:hover{opacity:.5}
.hero{position:relative;height:88vh;min-height:460px;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;opacity:0;transition:opacity 1.2s ease;pointer-events:none}.hero img.on{opacity:1;cursor:zoom-in;pointer-events:auto}.hero .dots{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;z-index:2}.hero .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);cursor:pointer}.hero .dots i.on{background:#fff}.hero h1,.hero p{z-index:2}
.hero h1{position:absolute;left:24px;bottom:18px;color:#fff;font-family:"Archivo Black",sans-serif;font-size:clamp(56px,13vw,200px);line-height:.85;letter-spacing:-.02em;text-shadow:0 2px 30px rgba(0,0,0,.25)}
.hero p{position:absolute;right:24px;bottom:28px;color:#fff;font-size:12px;letter-spacing:.25em;text-transform:uppercase}
section{padding:72px 24px;scroll-margin-top:50px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:24px;gap:16px;flex-wrap:wrap}
.sec-head h2{font:500 12px/1 Inter,sans-serif;letter-spacing:.3em;color:var(--mute)}
.filters button{background:none;border:0;font:500 12px Inter;letter-spacing:.18em;text-transform:uppercase;margin-left:18px;cursor:pointer;color:var(--mute);padding:4px 0}
.filters button.on{color:var(--ink);border-bottom:1px solid var(--ink)}
.grid{display:flex;gap:14px;align-items:flex-start}.grid .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.grid figure{margin:0;cursor:zoom-in;overflow:hidden;background:#f3f3f3}
.grid img{width:100%;height:auto;display:block;transition:transform .6s ease,opacity .4s}
.grid figure:hover img{transform:scale(1.03)}
.grid figure.hide{display:none}
.video{position:relative;aspect-ratio:16/9;max-width:1100px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.about{display:grid;grid-template-columns:1fr 1.4fr;gap:48px;max-width:1200px}
.about .lead{font-size:20px;line-height:1.6}
.about h3{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--mute);margin:26px 0 8px;font-weight:500}
.about h3:first-child{margin-top:0}
.about p{color:#333}
footer{padding:56px 24px 40px;border-top:1px solid var(--line);align-items:flex-end;display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px}
footer .ig{display:flex;flex-direction:column;gap:8px}footer .lbl{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute)}footer .ig a{display:inline-flex;align-items:center;gap:10px;font-size:18px;line-height:1;letter-spacing:.04em;border-bottom:1px solid transparent;padding-bottom:2px;width:max-content;transition:border-color .2s}footer .ig a:hover{border-color:var(--ink)}footer .ig svg{width:20px;height:20px;display:block;flex:none}
footer a.big:hover{opacity:.5}
footer small{color:var(--mute);font-size:12px;align-self:flex-end}
.lb{position:fixed;inset:0;background:rgba(255,255,255,.97);z-index:50;display:none;align-items:center;justify-content:center}
.lb.on{display:flex}
.lb img{max-width:92vw;max-height:90vh;object-fit:contain}
.lb button{position:absolute;background:none;border:0;font:400 28px Inter;cursor:pointer;padding:16px;color:var(--ink)}
.lb .x{top:8px;right:12px}.lb .p{left:8px;top:50%;transform:translateY(-50%)}.lb .n{right:8px;top:50%;transform:translateY(-50%)}
@media(max-width:760px){
 header{padding:12px 16px} .logo{font-size:16px} nav a{margin-left:10px;font-size:10px;letter-spacing:.08em}
 section{padding:52px 16px} .hero h1{left:16px} .hero p{display:none}
 .about{grid-template-columns:1fr;gap:24px} .grid,.grid .col{gap:8px}
 .filters button{margin:0 14px 0 0} footer{padding:40px 16px 32px}
}
.grid figure{position:relative}
.grid .multi{position:absolute;top:10px;right:10px;width:22px;height:22px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45));pointer-events:none}
.lb .cnt{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font:500 12px Inter;letter-spacing:.2em;color:var(--mute)}
.lb .dots{position:absolute;bottom:42px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.lb .dots i{width:6px;height:6px;border-radius:50%;background:#ccc;display:block}.lb .dots i.on{background:var(--ink)}
.lb img{touch-action:pan-y;user-select:none;-webkit-user-drag:none;transition:opacity .2s}
.lb .p[hidden],.lb .n[hidden]{display:none}
@media(max-width:760px){.lb .p,.lb .n{display:none}}
</style>
</head>
<body>
<header>
  <a class="logo" href="#top">HANS HSIEH</a>
  <nav><a href="#work">Work</a><a href="#contact">Contact</a></nav>
</header>

<div class="hero" id="top">
  <div class="dots"></div>
  <h1>HANS<br>HSIEH</h1>
  
</div>

<section id="work">
  <div class="sec-head">
    <h2>WORK</h2>
    <div class="filters"><button class="on" data-f="all">All</button><button data-f="women">Women</button><button data-f="men">Men</button></div>
  </div>
  <div class="grid" id="grid"></div>
</section>



<footer id="contact">
  <div class="ig"><span class="lbl">Instagram</span><a href="https://www.instagram.com/hans_hhsieh/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor"/></svg>@hans_hhsieh</a></div>
  <small>© <span id="y"></span> Hans Hsieh. All rights reserved.</small>
</footer>

<div class="lb" id="lb"><button class="x" aria-label="Close">×</button><button class="p" aria-label="Previous">←</button><img alt=""><button class="n" aria-label="Next">→</button><div class="dots"></div><div class="cnt"></div></div>

<script>
const ICON='<svg class="multi" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="14" height="14" rx="2" fill="#fff"/><path d="M3 7v12a2 2 0 0 0 2 2h12" fill="none" stroke="#fff" stroke-width="2"/></svg>';
const HERO_POSTS=3;
const grid=document.getElementById('grid');const FIGS=[];let G=[];let NC=0;
function layout(force){const n=innerWidth<=760?2:3;if(n===NC&&!force)return;NC=n;grid.innerHTML='';const cols=[...Array(n)].map(()=>{const c=document.createElement('div');c.className='col';grid.appendChild(c);return c});
 let v=0;FIGS.forEach(f=>{if(f.classList.contains('hide'))return;cols[v%n].appendChild(f);v++})}
const lb=document.getElementById('lb'),lbi=lb.querySelector('img'),cnt=lb.querySelector('.cnt'),dots=lb.querySelector('.dots'),P=lb.querySelector('.p'),N=lb.querySelector('.n');
let gi=0,k=0;
function render(){const g=G[gi].i;lbi.src=g[k][0];const m=g.length>1;
 cnt.textContent=m?`${k+1} / ${g.length}`:'';dots.innerHTML=m&&g.length<=12?g.map((_,j)=>`<i class="${j===k?'on':''}"></i>`).join(''):'';
 P.hidden=!m||k===0;N.hidden=!m||k===g.length-1;
 if(g[k+1]){const pre=new Image();pre.src=g[k+1][0]}}
function open(i,kk){gi=i;k=kk||0;render();lb.classList.add('on');document.body.style.overflow='hidden'}
function close(){lb.classList.remove('on');document.body.style.overflow=''}
function step(d){const n=k+d;if(n<0||n>=G[gi].i.length)return;k=n;render()}
function buildHero(){const hero=document.querySelector('.hero'),dw=hero.querySelector('.dots');const ng=Math.min(HERO_POSTS,G.length);let html='';
 for(let g=0;g<ng;g++)G[g].i.forEach((x,kk)=>{html+=`<img src="${x[0]}" alt="Hans Hsieh makeup work" data-g="${g}" data-k="${kk}"${g||kk?' loading="lazy"':' class="on"'}>`});
 dw.insertAdjacentHTML('beforebegin',html);
 const hs=[...hero.querySelectorAll('img')];let h=0,t;dw.innerHTML=[...Array(ng)].map((_,j)=>`<i class="${j?'':'on'}"></i>`).join('');const ds=[...dw.children];
 const go=n=>{hs[h].classList.remove('on');h=(n+hs.length)%hs.length;hs[h].classList.add('on');const g=+hs[h].dataset.g;ds.forEach((d,j)=>d.classList.toggle('on',j===g))};
 const play=()=>{clearInterval(t);t=setInterval(()=>go(h+1),3500)};
 ds.forEach((d,j)=>d.onclick=e=>{e.stopPropagation();go(hs.findIndex(x=>+x.dataset.g===j));play()});
 hs.forEach(im=>im.onclick=()=>open(+im.dataset.g,+im.dataset.k));play()}
fetch('works.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{
 G=[...d.ig,...d.wix];
 G.forEach((g,i)=>{const [src,w,h]=g.i[0];const f=document.createElement('figure');f.dataset.cat=g.c;f.dataset.i=i;
  f.innerHTML=`<img src="${src}" width="${w}" height="${h}" loading="lazy" alt="Hans Hsieh makeup work">`+(g.i.length>1?ICON:'');FIGS.push(f)});
 layout();buildHero()});
addEventListener('resize',()=>layout());
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{const cur=b.dataset.f;document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('on',x===b));FIGS.forEach(f=>f.classList.toggle('hide',cur!=='all'&&f.dataset.cat!==cur));layout(true)});
grid.onclick=e=>{const f=e.target.closest('figure');if(f)open(+f.dataset.i)};
lb.querySelector('.x').onclick=close;P.onclick=e=>{e.stopPropagation();step(-1)};N.onclick=e=>{e.stopPropagation();step(1)};
lb.onclick=e=>{if(e.target===lb)close()};
document.onkeydown=e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)};
let sx=null,sy=0;lb.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
lb.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
 if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))step(dx<0?1:-1);else if(dy>90)close()});
document.getElementById('y').textContent=new Date().getFullYear();
</script>
</body>
</html>
