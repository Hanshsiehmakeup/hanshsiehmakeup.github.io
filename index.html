<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>HANS HSIEH — Makeup & Hair Artist</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--ink:#111;--paper:#fff;--mute:#8a8a8a;--line:#e6e6e6}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:400 15px/1.7 Inter,"Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid var(--line)}
.logo{white-space:nowrap;font-family:"Archivo Black",sans-serif;font-size:20px;letter-spacing:.02em}
nav a{margin-left:22px;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
nav a:hover{opacity:.5}
.hero{position:relative;height:88vh;min-height:460px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.hero h1{position:absolute;left:24px;bottom:18px;color:#fff;font-family:"Archivo Black",sans-serif;font-size:clamp(56px,13vw,200px);line-height:.85;letter-spacing:-.02em;text-shadow:0 2px 30px rgba(0,0,0,.25)}
.hero p{position:absolute;right:24px;bottom:28px;color:#fff;font-size:12px;letter-spacing:.25em;text-transform:uppercase}
section{padding:72px 24px;scroll-margin-top:50px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:28px;gap:16px;flex-wrap:wrap}
.sec-head h2{font-family:"Archivo Black",sans-serif;font-size:clamp(32px,6vw,64px);line-height:1;letter-spacing:-.01em}
.filters button{background:none;border:0;font:500 12px Inter;letter-spacing:.18em;text-transform:uppercase;margin-left:18px;cursor:pointer;color:var(--mute);padding:4px 0}
.filters button.on{color:var(--ink);border-bottom:1px solid var(--ink)}
.grid{columns:3 280px;column-gap:14px}
.grid figure{break-inside:avoid;margin-bottom:14px;cursor:zoom-in;overflow:hidden;background:#f3f3f3}
.grid img{width:100%;height:auto;display:block;transition:transform .6s ease,opacity .4s}
.grid figure:hover img{transform:scale(1.03)}
.grid figure.hide{display:none}
.video{position:relative;aspect-ratio:16/9;max-width:1100px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.about{display:grid;grid-template-columns:1fr 1.4fr;gap:48px;max-width:1200px}
.about .lead{font-size:20px;line-height:1.6}
.about h3{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--mute);margin:26px 0 8px;font-weight:500}
.about h3:first-child{margin-top:0}
.about p{color:#333}
footer{padding:56px 24px 40px;border-top:2px solid var(--ink);display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px}
footer .big{font-family:"Archivo Black",sans-serif;font-size:clamp(28px,5vw,48px);line-height:1}
footer a.big:hover{opacity:.5}
footer small{color:var(--mute);font-size:12px;align-self:flex-end}
.lb{position:fixed;inset:0;background:rgba(255,255,255,.97);z-index:50;display:none;align-items:center;justify-content:center}
.lb.on{display:flex}
.lb img{max-width:92vw;max-height:90vh;object-fit:contain}
.lb button{position:absolute;background:none;border:0;font:400 28px Inter;cursor:pointer;padding:16px;color:var(--ink)}
.lb .x{top:8px;right:12px}.lb .p{left:8px;top:50%;transform:translateY(-50%)}.lb .n{right:8px;top:50%;transform:translateY(-50%)}
@media(max-width:760px){
 header{padding:12px 16px} .logo{font-size:16px} nav a{margin-left:10px;font-size:10px;letter-spacing:.08em}
 section{padding:52px 16px} .hero h1{left:16px} .hero p{display:none}
 .about{grid-template-columns:1fr;gap:24px} .grid{columns:2;column-gap:8px} .grid figure{margin-bottom:8px}
 .filters button{margin:0 14px 0 0} footer{padding:40px 16px 32px}
}
.grid figure{position:relative}
.grid .multi{position:absolute;top:10px;right:10px;width:22px;height:22px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45));pointer-events:none}
.lb .cnt{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font:500 12px Inter;letter-spacing:.2em;color:var(--mute)}
.lb .dots{position:absolute;bottom:42px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.lb .dots i{width:6px;height:6px;border-radius:50%;background:#ccc;display:block}.lb .dots i.on{background:var(--ink)}
.lb img{touch-action:pan-y;user-select:none;-webkit-user-drag:none;transition:opacity .2s}
.lb .p[hidden],.lb .n[hidden]{display:none}
@media(max-width:760px){.lb .p,.lb .n{display:none}}
</style>
